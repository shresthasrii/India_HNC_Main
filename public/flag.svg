        <line x1="-22.96" y1="-55.43" x2="22.96" y2="55.43"/>
        <line x1="-22.96" y1="55.43" x2="22.96" y2="-55.43"/>
        <line x1="-58.98" y1="-11.03" x2="58.98" y2="11.03"/>
